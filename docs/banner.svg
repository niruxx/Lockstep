<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">FuWindows</title>
  <desc id="desc">Take back control of Windows: privacy, debloat, performance and gaming, every change reversible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#14204a"/>
      <stop offset="100%" stop-color="#3b1d6e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowB)"/>

  <!-- Four-pane window mark, broken by a shield -->
  <g transform="translate(96 92)">
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="92" y="0" width="80" height="80" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="92" width="80" height="80" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="92" y="92" width="80" height="80" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M86 18 L142 38 V88 C142 124 118 150 86 164 C54 150 30 124 30 88 V38 Z"
          fill="url(#shield)" stroke="#0b1020" stroke-width="6" stroke-linejoin="round"/>
    <path d="M64 92 L80 108 L112 74" fill="none" stroke="#0b1020" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="330" y="168" font-size="84" font-weight="700" fill="url(#titleFill)" letter-spacing="-1">FuWindows</text>
    <text x="334" y="214" font-size="27" fill="#cbd5e1">Take back control of Windows: privacy, debloat, performance &amp; gaming.</text>

    <!-- Feature pills -->
    <g font-size="18" font-weight="600">
      <rect x="334" y="246" width="118" height="38" rx="19" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="393" y="271" text-anchor="middle" fill="#bae6fd">Privacy</text>

      <rect x="466" y="246" width="118" height="38" rx="19" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="525" y="271" text-anchor="middle" fill="#a7f3d0">Debloat</text>

      <rect x="598" y="246" width="152" height="38" rx="19" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="674" y="271" text-anchor="middle" fill="#fde68a">Performance</text>

      <rect x="764" y="246" width="118" height="38" rx="19" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="823" y="271" text-anchor="middle" fill="#fbcfe8">Gaming</text>

      <rect x="896" y="246" width="224" height="38" rx="19" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="1008" y="271" text-anchor="middle" fill="#ddd6fe">Every change reversible</text>
    </g>

    <text x="334" y="322" font-size="16" fill="#94a3b8">Native WinUI 3 · Windows 10 &amp; 11 · .NET 10</text>
  </g>
</svg>
