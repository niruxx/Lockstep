<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Lockstep</title>
  <desc id="desc">Lockstep: privacy and control for every Windows PC, kept in lockstep. Privacy, debloat, performance and gaming, every change reversible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="50%" stop-color="#0f1d45"/>
      <stop offset="100%" stop-color="#2a1660"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <!-- Padlock: shackle + body -->
    <g id="padlock">
      <path d="M40 78 V52 a40 40 0 0 1 80 0 V78" fill="none" stroke-width="16" stroke-linecap="round"/>
      <rect x="10" y="74" width="140" height="122" rx="22"/>
    </g>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowB)"/>

  <!-- Logo: padlocks stepping in unison, a Windows-style four-pane window in the front one -->
  <g transform="translate(80 70)">
    <use href="#padlock" transform="translate(-30 18)" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#padlock" transform="translate(-15 9)" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <use href="#padlock" fill="url(#lock)" stroke="url(#lock)"/>
    <g fill="#0b1226">
      <rect x="44" y="102" width="32" height="32" rx="4"/>
      <rect x="84" y="102" width="32" height="32" rx="4"/>
      <rect x="44" y="142" width="32" height="32" rx="4"/>
      <rect x="84" y="142" width="32" height="32" rx="4"/>
    </g>
  </g>

  <g font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="300" y="164" font-size="88" font-weight="700" fill="url(#titleFill)" letter-spacing="-1.5">Lockstep</text>
    <text x="304" y="210" font-size="27" fill="#cbd5e1">Privacy and control for every Windows PC, kept in lockstep.</text>

    <g font-size="18" font-weight="600">
      <rect x="304" y="242" width="118" height="38" rx="19" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="363" y="267" text-anchor="middle" fill="#a5f3fc">Privacy</text>

      <rect x="436" y="242" width="118" height="38" rx="19" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="495" y="267" text-anchor="middle" fill="#a7f3d0">Debloat</text>

      <rect x="568" y="242" width="152" height="38" rx="19" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="644" y="267" text-anchor="middle" fill="#fde68a">Performance</text>

      <rect x="734" y="242" width="118" height="38" rx="19" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="793" y="267" text-anchor="middle" fill="#fbcfe8">Gaming</text>

      <rect x="866" y="242" width="160" height="38" rx="19" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="946" y="267" text-anchor="middle" fill="#bfdbfe">Profiles &amp; sync</text>

      <rect x="1040" y="242" width="208" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="1144" y="267" text-anchor="middle" fill="#ddd6fe">Every change reversible</text>
    </g>

    <text x="304" y="318" font-size="16" fill="#94a3b8">Native WinUI 3 · Windows 10 &amp; 11 · .NET 10</text>
  </g>
</svg>
